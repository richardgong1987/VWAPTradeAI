0" height="90" rx="10.8" ry="10.8" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="125" y="205">SignalDetector</text><text x="125" y="219">+ VWAP series</text><text x="125" y="247">finds the signal</text></g></g></g><g data-cell-id="p1-7"><g transform="translate(0.5,0.5)"><rect x="215" y="176" width="170" height="90" rx="10.8" ry="10.8" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="300" y="198">AiChartshots</text><text x="300" y="226">after SignalMarkers.Draw,</text><text x="300" y="240">waits for the signal's bar,</text><text x="300" y="254">then Chart.TakeChartshot()</text></g></g></g><g data-cell-id="p1-8"><g transform="translate(0.5,0.5)"><rect x="410" y="176" width="130" height="90" rx="10.8" ry="10.8" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="475" y="205">AiTrendFilter</text><text x="475" y="233">async flow,</text><text x="475" y="247">eligibility check</text></g></g></g><g data-cell-id="p1-9"><g transform="translate(0.5,0.5)"><rect x="565" y="176" width="130" height="90" rx="10.8" ry="10.8" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="630" y="212">TrendDirectionGate</text><text x="630" y="240">PASS / REJECT rule</text></g></g></g><g data-cell-id="p1-10"><g transform="translate(0.5,0.5)"><rect x="750" y="176" width="125" height="90" rx="10.8" ry="10.8" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="812.5" y="205">OrderExecutor</text><text x="812.5" y="233">Ask/Bid, stop, target,</text><text x="812.5" y="247">sizing, broker</text></g></g></g><g data-cell-id="p1-11"><g transform="translate(0.5,0.5)"><rect x="400" y="310" width="150" height="60" rx="7.2" ry="7.2" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="475" y="338">TrendAssessmentClient</text><text x="475" y="352">HTTP adapter</text></g></g></g><g data-cell-id="p1-12"><g transform="translate(0.5,0.5)"><rect x="590" y="310" width="170" height="60" rx="7.2" ry="7.2" fill="#ffffff" stroke="#666666" stroke-dasharray="3 3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="675" y="338">TrendAssessmentRecorder</text><text x="675" y="352">(optional)</text></g></g></g><g data-cell-id="p1-13"><g transform="translate(0.5,0.5)"><rect x="900" y="136" width="220" height="244" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="912" y="162">VWAPTradeAI owns</text><text x="912" y="176">- signal detection</text><text x="912" y="190">- Chart.TakeChartshot()</text><text x="912" y="204">- the asynchronous request</text><text x="912" y="218">- TrendDirectionGate</text><text x="912" y="232">- trade eligibility</text><text x="912" y="246">- OrderExecutor</text><text x="912" y="260">- optional assessment recording</text></g></g></g><g data-cell-id="p1-14"><g><path d="M 190 221 L 205.82 221" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 213.32 221 L 205.82 224.75 L 205.82 217.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="p1-15"><g><path d="M 385 221 L 400.82 221" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 408.32 221 L 400.82 224.75 L 400.82 217.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="p1-16"><g><path d="M 540 221 L 555.82 221" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 563.32 221 L 555.82 224.75 L 555.82 217.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="p1-17"><g><path d="M 695 221 L 740.82 221" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 748.32 221 L 740.82 224.75 L 740.82 217.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(26, 26, 26);"><rect fill="#ffffff" stroke="none" x="708" y="215" width="31" height="14" stroke-width="0" style="fill: rgb(255, 255,