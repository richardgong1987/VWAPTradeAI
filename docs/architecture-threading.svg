hread pool task)</text></g></g></g><g data-cell-id="p4-6"><g transform="translate(0.5,0.5)"><rect x="40" y="470" width="1180" height="130" fill="#d5e8d4" stroke="#82b366" stroke-dasharray="6 4" pointer-events="all" style="fill: rgb(213, 232, 212); stroke: rgb(130, 179, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(26, 26, 26);"><text x="54" y="498">TrendAssessmentModel  -&gt;  Ollama  -&gt;  gemma3:27b</text></g></g></g><g data-cell-id="p4-7"><g transform="translate(0.5,0.5)"><rect x="60" y="150" width="80" height="70" rx="8.4" ry="8.4" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="100" y="190">OnBar</text></g></g></g><g data-cell-id="p4-8"><g transform="translate(0.5,0.5)"><rect x="160" y="150" width="110" height="70" rx="8.4" ry="8.4" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="215" y="183">Chart.</text><text x="215" y="197">TakeChartshot</text></g></g></g><g data-cell-id="p4-9"><g transform="translate(0.5,0.5)"><rect x="290" y="150" width="110" height="70" rx="8.4" ry="8.4" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="345" y="183">SignalMarkers.</text><text x="345" y="197">Draw</text></g></g></g><g data-cell-id="p4-10"><g transform="translate(0.5,0.5)"><rect x="420" y="150" width="110" height="70" rx="8.4" ry="8.4" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="475" y="183">AiTrendFilter.</text><text x="475" y="197">Submit</text></g></g></g><g data-cell-id="p4-11"><g transform="translate(0.5,0.5)"><rect x="550" y="150" width="200" height="70" rx="8.4" ry="8.4" fill="#ffffff" stroke="#666666" stroke-dasharray="3 3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="650" y="176">OnBar has returned.</text><text x="650" y="190">The main thread is free:</text><text x="650" y="204">ticks, bars, other events</text></g></g></g><g data-cell-id="p4-12"><g transform="translate(0.5,0.5)"><rect x="770" y="150" width="120" height="70" rx="8.4" ry="8.4" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(214, 182, 86);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="830" y="183">BeginInvoke</text><text x="830" y="197">OnMainThread(...)</text></g></g></g><g data-cell-id="p4-13"><g transform="translate(0.5,0.5)"><rect x="910" y="150" width="130" height="70" rx="8.4" ry="8.4" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="975" y="176">eligibility check</text><text x="975" y="190">+ TrendDirection</text><text x="975" y="204">Gate</text></g></g></g><g data-cell-id="p4-14"><g transform="translate(0.5,0.5)"><rect x="1060" y="150" width="140" height="70" rx="8.4" ry="8.4" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="1130" y="176">OrderExecutor.</text><text x="1130" y="190">TryEnter</text><text x="1130" y="204">(cTrader API)</text></g></g></g><g data-cell-id="p4-15"><g><path d="M 140 185 L 150.82 185" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 158.32 185 L 150.82 188.75 L 150.82 181.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="p4-16"><g><path d="M 270 185 L 280.82 185" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 288.32 185 L 280.82 188.75 L 280.82 181.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="p4-17"><g><path d="M 400 185 L 410.82 185" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 418.32 185 L 410.82 188.75 L 410.82 181.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="p4-18"><g><path d="M 890 185 L 900.82 185" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 908.32 185 L 900.82 188.75 L 900.82 181.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="p4-19"><g><path d="M 1040 185 L 1050.82 185" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 1058.32 185 L 1050.82 188.75 L 1050.82 181.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="p4-20"><g><path d="M 530 185 L 540.82 185" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 548.32 185 L 540.82 188.75 L 540.82 181.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="p4-21"><g><path d="M 750 185 L 760.82 185" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 768.32 185 L 760.82 188.75 L 760.82 181.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="p4-22"><g transform="translate(0.5,0.5)"><rect x="420" y="330" width="130" height="70" rx="8.4" ry="8.4" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="485" y="363">HTTP POST</text><text x="485" y="377">/v1/assessments</text></g></g></g><g data-cell-id="p4-23"><g transform="translate(0.5,0.5)"><rect x="570" y="330" width="180" height="70" rx="8.4" ry="8.4" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="660" y="363">waiting for the answer</text><text x="660" y="377">8-20 s</text></g></g></g><g data-cell-id="p4-24"><g transform="translate(0.5,0.5)"><rect x="770" y="330" width="170" height="70" rx="8.4" ry="8.4" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="855" y="363">response parsing</text><text x="855" y="377">(TrendAssessmentReply)</text></g></g></g><g data-cell-id="p4-25"><g><path d="M 550 365 L 560.82 365" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 568.32 365 L 560.82 368.75 L 560.82 361.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="p4-26"><g><path d="M 750 365 L 760.82 365" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 768.32 365 L 760.82 368.75 L 760.82 361.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="p4-27"><g><path d="M 475 220 L 475 265 Q 475 275 480 275 L 482.5 275 Q 485 275 485 285 L 485 320.82" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 485 328.32 L 481.25 320.82 L 488.75 320.82 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(26, 26, 26);"><rect fill="#ffffff" stroke="none" x="448" y="269" width="65" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="480" y="279.5">start the task</text></g></g></g><g data-cell-id="p4-28"><g><path d="M 855 330 L 855 280 Q 855 270 845 270 L 837.5 270 Q 830 270 830 260 L 830 229.18" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 830 221.68 L 833.75 229.18 L 826.25 229.18 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(26, 26, 26);"><rect fill="#ffffff" stroke="none" x="833" y="264" width="29" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="847" y="274.5">result</text></g></g></g><g data-cell-id="p4-29"><g transform="translate(0.5,0.5)"><path d="M 40 630 L 1206 630 L 1220 644 L 1220 720 L 40 720 L 40 630 Z" fill="#fff2cc" stroke="#d6b656" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(214, 182, 86);"/><path d="M 1206 630 L 1206 644 L 1220 644" fill="none" stroke="#d6b656" stroke-miterlimit="10" pointer-events="all" style="stroke: rgb(214, 182, 86);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="start" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="52" y="656">Visual backtest, the deliberate exception: AiTrendFilter.AssessAndWait holds the main thread until the answer is in,</text><text x="52" y="670">so the backtest's clock stands still and the signal is decided on its own bar. The request still runs in the background,</text><text x="52" y="684">so the waiting thread is never needed to finish it.</text></g></g></g><g data-cell-id="p4-30"><g transform="translate(0.5,0.5)"><rect x="420" y="510" width="520" height="60" rx="7.2" ry="7.2" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="680" y="538">TrendAssessmentModel builds the request  -&gt;  Ollama  -&gt;  gemma3:27b inference</text><text x="680" y="552">-&gt;  validated assessment returned</text></g></g></g><g data-cell-id="p4-31"><g><path d="M 485 400 L 485 440 Q 485 450 495 450 L 540 450 Q 550 450 550 460 L 550 500.82" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 550 508.32 L 546.25 500.82 L 553.75 500.82 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(26, 26, 26);"><rect fill="#ffffff" stroke="none" x="504" y="444" width="39" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="523" y="454.5">request</text></g></g></g><g data-cell-id="p4-32"><g><path d="M 810 510 L 810 460 Q 810 450 820 450 L 845 450 Q 855 450 855 440 L 855 409.18" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 855 401.68 L 858.75 409.18 L 851.25 409.18 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(26, 26, 26);"><rect fill="#ffffff" stroke="none" x="805" y="444" width="47" height="14" stroke-width="0" style="fill: rgb(255, 255, 255);"/><text x="828" y="454.5">response</text></g></g></g></g></g></g></svg>