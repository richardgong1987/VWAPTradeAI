e</text><text x="147.5" y="195">chart shows the signal's bar:</text><text x="147.5" y="209">Chart.TakeChartshot()</text></g></g></g><g data-cell-id="p6-6"><g transform="translate(0.5,0.5)"><rect x="270" y="160" width="140" height="60" rx="7.2" ry="7.2" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="340" y="195">PNG in memory</text></g></g></g><g data-cell-id="p6-7"><g transform="translate(0.5,0.5)"><rect x="450" y="160" width="220" height="60" rx="7.2" ry="7.2" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="560" y="188">TrendAssessmentClient</text><text x="560" y="202">-&gt;  TrendAssessmentModel</text></g></g></g><g data-cell-id="p6-8"><g transform="translate(0.5,0.5)"><path d="M 560 260 L 650 305 L 560 350 L 470 305 Z" fill="#fff2cc" stroke="#d6b656" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(255, 242, 204); stroke: rgb(214, 182, 86);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="560" y="303">保存AI评估截图</text><text x="560" y="317">= true?</text></g></g></g><g data-cell-id="p6-9"><g transform="translate(0.5,0.5)"><rect x="270" y="275" width="140" height="60" rx="7.2" ry="7.2" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: rgb(245, 245, 245); stroke: rgb(102, 102, 102);"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(26, 26, 26);"><text x="340" y="303">not persisted</text><text x="340" y="317">(default)</text></g></g></g><g data-cell-id="p6-10"><g transform="translate(0.5,0.5)"><rect x="700" y="275" width="19